# app.domain.categorize.normalize returns (lowercase, umlauts folded, no qualifiers such
# as "bio", no quantities); a test checks this, that every category is known and that no
# name is listed twice. On startup missing names are inserted and rows still `seed` take
# the value here; a user's choice (source `user`) is never touched.
