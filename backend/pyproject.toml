[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "budgie"
version = "0.1.0"
description = "Budgie: receipt-to-expense service"
requires-python = ">=3.12"
# Compatible ranges, lower bound = the version resolved when pinned (F01).
# 0.x packages are capped at the next minor where minors have broken APIs (httpx),
# otherwise at the next major. Starlette comes through FastAPI's own pin.
dependencies = [
    "fastapi>=0.142.2,<1",
    "uvicorn[standard]>=0.54,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy>=2.1,<2.2",
    "httpx>=0.28.1,<0.29",
    # FastAPI needs it for the multipart upload route (decision 0016). Capped at 0.1:
    # 0.0.x releases have changed the API (the module rename in 0.0.13).
    "python-multipart>=0.0.32,<0.1",
    # IANA time zones for zoneinfo (today is the Europe/Berlin date); the slim Docker image
    # has no system zoneinfo. Calendar-versioned data only, so no upper cap.
    "tzdata>=2026.5",
    # The item category seed (app/domain/data/item_categories_seed.yaml, decision 0020);
    # read with yaml.safe_load only.
    "pyyaml>=6.0.3,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    # Exact: pre-commit uses the same ruff version.
    "ruff==0.16.10",
    "import-linter>=2.15,<3",
]
# The evaluation's image downsizing (eval/images.py, decision 0028); not in the Docker image.
eval = [
    # Exact: the committed demo PNGs are checked pixel for pixel against a fresh render, and
    # glyph edges depend on the FreeType bundled in each Pillow wheel (decision 0022). It also
    # keeps the eval's downsizing reproducible (decision 0028).
    "pillow==12.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# The Dockerfile runs a non-editable `pip install ./backend`; the prompts and the item
# category seed must ship with it.
[tool.setuptools.package-data]
app = ["ai/prompts/*/*.txt", "domain/data/*.yaml"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
# A003: a class member shadowing a builtin that the class then uses in an annotation
# (`def list` + `-> list[...]`) crashes on 3.12, which evaluates annotations eagerly,
# but passes on the dev container's 3.14 (F06).
select = ["E", "F", "I", "B", "UP", "SIM", "A003"]

[tool.ruff.lint.isort]
known-first-party = ["app", "eval"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
# The repository root (the rootdir), so the top-level `eval` package imports in tests.
pythonpath = ["."]
markers = [
    "integration: needs a live model server; excluded from CI with -m 'not integration'",
]

# ---------------------------------------------------------------- import-linter
# Layer rules from docs/wiki/architecture.md and decision 0006.
[tool.importlinter]
# `eval` is the top-level evaluation package (F11), beside `backend/`.
root_packages = ["app", "eval"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: api > services > (domain | db | ai)"
type = "layers"
layers = [
    "app.api",
    "app.services",
    "app.domain | app.db | app.ai",
]

[[tool.importlinter.contracts]]
name = "api does not import db or ai"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.db", "app.ai"]
# Direct imports only: api reaches db/ai through services, which the layers contract allows.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "domain is pure"
type = "forbidden"
source_modules = ["app.domain"]
# Everything app-internal except app.errors (shared typed errors), plus the
# infrastructure packages. Checks indirect imports too.
forbidden_modules = [
    "app.config",
    "app.main",
    "app.openapi_export",
    "app.services",
    "app.api",
    "app.db",
    "app.ai",
    "httpx",
    "fastapi",
    "pydantic_settings",
    "sqlalchemy",
]

[[tool.importlinter.contracts]]
name = "Only app.db imports SQLAlchemy"
type = "forbidden"
# The whole app, so a new top-level module is covered without editing this list.
source_modules = ["app"]
forbidden_modules = ["sqlalchemy"]
# `app.db.**` matches only submodules, so `app.db` itself needs its own line. That line has
# no match until app/db/__init__.py imports SQLAlchemy, hence alerting "none" (default: error).
ignore_imports = [
    "app.db -> sqlalchemy",
    "app.db.** -> sqlalchemy",
]
unmatched_ignore_imports_alerting = "none"
# Direct imports only: services may use app.db, which wraps SQLAlchemy.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "app does not import eval"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = ["eval"]

[[tool.importlinter.contracts]]
name = "eval does not import app.api or app.db"
type = "forbidden"
source_modules = ["eval"]
forbidden_modules = ["app.api", "app.db"]
# Direct imports only: eval runs the pipeline's process_extraction (app.services), and
# app.services imports app.db, which the layers contract allows (decision 0028).
allow_indirect_imports = true
