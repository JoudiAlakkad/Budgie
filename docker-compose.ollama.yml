# Override: run Ollama in a container too, and point the app at it.
#
#   docker compose -f docker-compose.yml -f docker-compose.ollama.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.ollama.yml exec ollama ollama pull qwen2.5vl:3b
#
# The model runs on the CPU here (Docker on a Mac has no GPU), so it is much slower than a
# host Ollama: the timeout is raised to 600 s per request. Set LLM_TIMEOUT_S to change it.
services:
  app:
    environment:
      - LLM_BASE_URL=http://ollama:11434/v1
      - LLM_TIMEOUT_S=${LLM_TIMEOUT_S:-600}
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:0.35.1
    environment:
      # qwen2.5vl:3b fails on full-size photos at the default 4096 (decision 0030).
      - OLLAMA_CONTEXT_LENGTH=8192
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama-models:
