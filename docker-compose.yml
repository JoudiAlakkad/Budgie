# Budgie with Docker Compose (README "Build, test and start").
#
#   docker compose up -d --build
#     The app only. It uses an Ollama running natively on the host
#     (faster on a Mac, where the container has no GPU).
#
#   docker compose -f docker-compose.yml -f docker-compose.ollama.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.ollama.yml exec ollama ollama pull qwen2.5vl:3b
#     Also runs Ollama in a container (docker-compose.ollama.yml), and points the app at it.
#
# Settings are env vars read by backend/app/config.py, which holds the defaults
# (docs/wiki/backend/configuration.md). Each variable below is passed through only when
# it is set in the shell or in .env; otherwise the app's own default applies. There are
# no secrets: LLM_API_KEY is a dummy value unless your server wants a real bearer token.
name: budgie

services:
  app:
    build: .
    image: budgie:local
    # Localhost only: Budgie has no login (one local user), so it must not be reachable
    # from the network. Change this only behind your own authentication.
    ports:
      - "127.0.0.1:${BUDGIE_PORT:-8000}:8000"
    environment:
      # The one container-specific default: the app's own default (localhost) would be
      # the container itself.
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      - LLM_MODEL
      - LLM_API_KEY
      - LLM_TIMEOUT_S
      - LLM_MAX_RETRIES
      - LLM_TEMPERATURE
      - LLM_MAX_TOKENS
      - PROMPT_VERSION
      - MAX_UPLOAD_MB
      - LOG_LEVEL
      # DATABASE_URL, UPLOAD_DIR and FRONTEND_DIR are set by the image (Dockerfile).
    # host.docker.internal also resolves on Linux hosts.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The database and uploads (decision 0006); nothing else mounts this volume.
    volumes:
      - budgie-data:/data
    restart: unless-stopped

volumes:
  budgie-data:
